<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maquette 4 — Tunnel de cartes</title>
<style>
  :root { --red:#ed1d24; --bg:#0a0a0c; --text:#eee; --dim:#a3a3ab; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow-x:hidden; }
  .back { position:fixed; top:14px; left:16px; z-index:30; color:var(--dim); text-decoration:none; font-size:.85rem; background:#000a; padding:6px 10px; border-radius:6px; }
  #spacer { height:1000vh; }
  .stage { position:fixed; inset:0; perspective:900px; perspective-origin:50% 45%; overflow:hidden; }
  .world { position:absolute; left:50%; top:50%; transform-style:preserve-3d; will-change:transform; }

  /* grille de sol et plafond façon couloir */
  .grid { position:absolute; width:4000px; height:30000px; left:-2000px; transform-origin:top center;
          background-image:linear-gradient(#ed1d2433 1px, transparent 1px), linear-gradient(90deg, #ed1d2433 1px, transparent 1px); background-size:120px 120px; }
  .floor { top:380px; transform:rotateX(90deg); }
  .ceil  { top:-420px; transform:rotateX(90deg); opacity:.35; }

  .slide { position:absolute; transform-style:preserve-3d; }
  .card { cursor:pointer; position:absolute; width:620px; left:-310px; top:-210px; display:grid; grid-template-columns:240px 1fr; background:#141418ee; border:1px solid #ffffff1a; border-top:3px solid var(--c);
          border-radius:14px; overflow:hidden; box-shadow:0 30px 90px -20px var(--c); }
  .card .img { background-size:cover; background-position:center; min-height:360px; }
  .card .body { padding:24px; }
  .card .era { color:var(--c); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; }
  .card h2 { margin:8px 0 10px; font-size:1.6rem; }
  .card p { color:#cfcfd4; line-height:1.55; font-size:.95rem; margin:0 0 14px; }
  .card .thumbs img { width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid var(--c); margin-right:6px; }
  .year { position:absolute; left:-600px; width:1200px; top:-330px; text-align:center; font-size:340px; font-weight:900; color:transparent; -webkit-text-stroke:2px var(--c); opacity:.25; transform:translateZ(-400px); pointer-events:none; }

  .intro { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; z-index:5; text-align:center; }
  .intro h1 { font-size:clamp(2.4rem,8vw,6rem); margin:0; font-style:italic; font-weight:900; }
  .intro h1 b { color:var(--red); }
  .intro p { color:var(--dim); letter-spacing:3px; text-transform:uppercase; font-size:.8rem; }
  .bar { position:fixed; left:0; bottom:0; height:4px; background:var(--red); box-shadow:0 0 12px var(--red); z-index:20; }
  .vignette { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 45%, #000 100%); z-index:4; }

  @media (max-width:760px) {
    .card { width:330px; left:-165px; grid-template-columns:1fr; top:-280px; }
    .card .img { min-height:170px; }
    .card h2 { font-size:1.25rem; } .card p { font-size:.85rem; }
    .year { font-size:180px; }
  }
  .more { display:inline-flex; align-items:center; gap:6px; margin-top:14px; background:none; border:1px solid var(--c, #ed1d24); color:var(--c, #ed1d24); border-radius:20px; padding:6px 14px; font-size:.8rem; font-weight:700; cursor:pointer; letter-spacing:.5px; transition:background .2s, color .2s; }
  .more:hover, .more:focus-visible { background:var(--c, #ed1d24); color:#000; outline:none; }
</style>
</head>
<body>
<a class="back" href="index.html">← Maquettes</a>
<div class="stage"><div class="world" id="world">
  <div class="grid floor"></div><div class="grid ceil"></div>
</div></div>
<div class="vignette"></div>
<div class="intro" id="intro"><h1>Traverser le <b>temps</b></h1><p>Faites défiler pour avancer</p></div>
<div class="bar" id="bar"></div>
<div id="spacer"></div>

<script src="events.js"></script>
<script src="detail.js"></script>
<script>
const world = document.getElementById('world');
const GAP = 1600;                                     // distance en Z entre deux époques
const slides = TIMELINE.map((ev, i) => {
  const s = document.createElement('div');
  s.className = 'slide'; s.style.setProperty('--c', ev.color);
  const x = innerWidth < 760 ? 0 : (i % 2 ? -260 : 260);
  s.style.transform = `translate3d(${x}px, 0, ${-(i + 1) * GAP}px) rotateY(${x ? (x > 0 ? -12 : 12) : 0}deg)`;
  s.innerHTML = `
    <div class="year">${ev.year}</div>
    <article class="card">
      <div class="img" style="background-image:url('${ev.image}')"></div>
      <div class="body">
        <div class="era">${ev.era} · ${ev.date}</div>
        <h2>${ev.title}</h2>
        <p>${ev.text}</p>
        <div class="thumbs">${ev.thumbs.map(t => `<img src="${t}" alt="">`).join('')}</div>
        <button class="more">Déployer la carte +</button>
      </div>
    </article>`;
  world.appendChild(s);
  s.querySelector('.card').addEventListener('click', e => Detail.open(i, e.currentTarget));
  return s;
});

let cur = 0, target = 0;
addEventListener('scroll', () => { target = scrollY / (document.documentElement.scrollHeight - innerHeight); }, { passive:true });
(function loop() {
  cur += (target - cur) * 0.08;
  const z = cur * (TIMELINE.length * GAP + 400);
  const sway = Math.sin(cur * Math.PI * TIMELINE.length) * 40;   // léger balancement de caméra
  world.style.transform = `translate3d(${sway}px, 0, ${z}px)`;
  slides.forEach((s, i) => {
    const dz = -(i + 1) * GAP + z;                 // < 0 : devant, > 0 : déjà dépassée
    let o = dz > 300 ? 0 : dz < -GAP * 2.5 ? 0 : dz < -GAP * 1.6 ? (dz + GAP * 2.5) / (GAP * 0.9) : 1;
    if (dz > 0) o = Math.max(0, 1 - dz / 300);
    s.style.opacity = o;
  });
  document.getElementById('bar').style.width = (cur * 100) + '%';
  document.getElementById('intro').style.opacity = Math.max(0, 1 - cur * 20);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
