<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maquette 2 — Frise horizontale</title>
<style>
  :root { --red:#ed1d24; --bg:#0d0d0f; --text:#eee; --dim:#a3a3ab; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow-x:hidden; }
  .back { position:fixed; top:14px; left:16px; z-index:30; color:var(--dim); text-decoration:none; font-size:.85rem; background:#000a; padding:6px 10px; border-radius:6px; }

  .scroller { position:relative; }           /* hauteur fixée en JS = nb de panneaux × 100vh */
  .sticky { position:sticky; top:0; height:100vh; overflow:hidden; }
  .bgfx { position:absolute; inset:0; transition:background 1s; }
  .track { position:absolute; top:0; left:0; height:100%; display:flex; will-change:transform; }
  .panel { width:100vw; height:100%; display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:4vw; padding:8vh 8vw 18vh; position:relative; }
  .poster-3d { perspective:1000px; display:flex; justify-content:center; }
  .poster-3d .frame { width:min(34vw,360px); aspect-ratio:2/3; border-radius:14px; background-size:cover; background-position:center;
                      box-shadow:0 40px 80px -20px #000, 0 0 60px -10px var(--c); transform-style:preserve-3d; will-change:transform; position:relative; }
  .poster-3d .frame::after { content:''; position:absolute; inset:0; border-radius:14px; background:linear-gradient(120deg,transparent 40%,#ffffff33 50%,transparent 60%); background-size:250% 100%; background-position:var(--shine,100%) 0; }
  .poster-3d .chip { position:absolute; width:70px; height:70px; border-radius:50%; background-size:cover; background-position:center; border:3px solid var(--c); box-shadow:0 10px 30px #000; transform:translateZ(80px); }
  .text .era { color:var(--c); letter-spacing:3px; text-transform:uppercase; font-weight:800; font-size:.8rem; }
  .text h2 { font-size:clamp(1.8rem,4vw,3.4rem); line-height:1.05; margin:10px 0 18px; }
  .text p { color:#cfcfd4; font-size:1.05rem; line-height:1.6; max-width:520px; }
  .tags span { display:inline-block; margin:4px 6px 0 0; padding:5px 12px; border:1px solid var(--c); color:var(--c); border-radius:20px; font-size:.78rem; }
  .text > * { will-change:transform, opacity; }

  .yearbox { position:absolute; top:6vh; right:6vw; font-size:clamp(3rem,10vw,8rem); font-weight:900; font-variant-numeric:tabular-nums; color:transparent; -webkit-text-stroke:1.5px #ffffff40; z-index:5; }
  .rail { position:absolute; left:8vw; right:8vw; bottom:8vh; height:2px; background:#2c2c31; z-index:5; }
  .rail .fill { position:absolute; left:0; top:0; height:100%; background:var(--red); box-shadow:0 0 12px var(--red); width:0; }
  .rail .dot { position:absolute; top:50%; width:14px; height:14px; border-radius:50%; background:var(--bg); border:2px solid #555; transform:translate(-50%,-50%); transition:.3s; }
  .rail .dot.on { border-color:var(--c); background:var(--c); box-shadow:0 0 14px var(--c); }
  .rail .dot span { position:absolute; top:16px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:.7rem; color:var(--dim); }

  .intro, .outro { height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:0 16px; }
  .intro h1 { font-size:clamp(2.4rem,7vw,5.5rem); margin:0; font-style:italic; }
  .intro h1 b { color:var(--red); }
  .intro p, .outro p { color:var(--dim); }

  @media (max-width:760px) {
    .panel { grid-template-columns:1fr; gap:20px; padding:12vh 16px 16vh; align-content:center; }
    .poster-3d .frame { width:42vw; }
    .text p { font-size:.92rem; }
    .rail .dot span { display:none; }
    .rail { left:16px; right:16px; }
  }
</style>
</head>
<body>
<a class="back" href="index.html">← Maquettes</a>
<section class="intro"><h1>Le fil du <b>temps</b></h1><p>Descendez : la frise défile de gauche à droite.</p></section>

<section class="scroller" id="scroller">
  <div class="sticky">
    <div class="bgfx" id="bgfx"></div>
    <div class="yearbox" id="year">∞</div>
    <div class="track" id="track"></div>
    <div class="rail" id="rail"><div class="fill" id="fill"></div></div>
  </div>
</section>

<section class="outro"><p>Fin de la frise — <a style="color:var(--red)" href="../index.html#/catalogue">explorer le catalogue</a></p></section>

<script src="events.js"></script>
<script>
const track = document.getElementById('track'), rail = document.getElementById('rail');
const N = TIMELINE.length;
TIMELINE.forEach((ev, i) => {
  const p = document.createElement('div');
  p.className = 'panel'; p.style.setProperty('--c', ev.color);
  const chips = ev.thumbs.slice(0, 2).map((t, k) =>
    `<div class="chip" style="background-image:url('${t}'); ${k ? 'right:-20px; bottom:40px' : 'left:-24px; top:30px'}"></div>`).join('');
  p.innerHTML = `
    <div class="poster-3d"><div class="frame" style="background-image:url('${ev.image}')">${chips}</div></div>
    <div class="text">
      <div class="era">${ev.era} · ${ev.date}</div>
      <h2>${ev.title}</h2>
      <p>${ev.text}</p>
      <div class="tags">${ev.tags.map(t => `<span>${t}</span>`).join('')}</div>
    </div>`;
  track.appendChild(p);
  const d = document.createElement('div');
  d.className = 'dot'; d.style.left = (i / (N - 1) * 100) + '%'; d.style.setProperty('--c', ev.color);
  d.innerHTML = `<span>${ev.date}</span>`;
  rail.appendChild(d);
});
const scroller = document.getElementById('scroller');
scroller.style.height = (N * 100) + 'vh';
const panels = [...track.children], dots = [...rail.querySelectorAll('.dot')];
const yearEl = document.getElementById('year'), bg = document.getElementById('bgfx'), fill = document.getElementById('fill');
let shownYear = null, animId = 0;

function update() {
  const r = scroller.getBoundingClientRect();
  const total = scroller.offsetHeight - innerHeight;
  const p = Math.max(0, Math.min(1, -r.top / total));
  const pos = p * (N - 1);                       // position flottante dans la frise
  track.style.transform = `translateX(${-pos * innerWidth}px)`;
  fill.style.width = (p * 100) + '%';
  const idx = Math.round(pos), ev = TIMELINE[idx];
  dots.forEach((d, i) => d.classList.toggle('on', i <= idx));
  bg.style.background = `radial-gradient(circle at 30% 50%, ${ev.color}33, transparent 60%)`;
  if (shownYear !== idx) { shownYear = idx; animateYear(ev.year); }

  panels.forEach((pn, i) => {
    const off = i - pos;                           // -1..0..1 : distance au centre
    const frame = pn.querySelector('.frame');
    frame.style.transform = `rotateY(${off * -35}deg) rotateX(${Math.abs(off) * 8}deg) scale(${1 - Math.abs(off) * .2})`;
    frame.style.setProperty('--shine', (50 + off * 100) + '%');
    [...pn.querySelector('.text').children].forEach((el, k) => {
      el.style.transform = `translateX(${off * (120 + k * 70)}px)`;
      el.style.opacity = 1 - Math.min(1, Math.abs(off) * 1.6);
    });
  });
}
// compteur d'année qui défile
function animateYear(target) {
  const n = parseInt(target), from = parseInt(yearEl.textContent);
  if (isNaN(n) || isNaN(from)) { yearEl.textContent = target; return; }
  const t0 = performance.now(), id = ++animId;
  (function step(t) {
    if (id !== animId) return;
    const k = Math.min(1, (t - t0) / 600);
    yearEl.textContent = Math.round(from + (n - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
addEventListener('scroll', () => requestAnimationFrame(update), { passive:true });
addEventListener('resize', update);
update();
</script>
</body>
</html>
