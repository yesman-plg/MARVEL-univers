<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maquette 1 — Le Chemin</title>
<style>
  :root { --red:#ed1d24; --bg:#0d0d0f; --panel:#17171a; --text:#eee; --dim:#a3a3ab; --gold:#d4af37; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow-x:hidden; }
  .back { position:fixed; top:14px; left:16px; z-index:20; color:var(--dim); text-decoration:none; font-size:.85rem; background:#000a; padding:6px 10px; border-radius:6px; }

  /* Intro */
  .intro { height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; overflow:hidden; }
  .intro::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 40%, #3a0003 0%, transparent 60%); }
  .intro h1 { position:relative; font-size:clamp(2.6rem,8vw,6rem); margin:0; font-weight:900; font-style:italic; letter-spacing:2px; }
  .intro h1 span { color:var(--red); }
  .intro p { position:relative; color:var(--dim); max-width:560px; padding:0 16px; }
  .scroll-hint { position:absolute; bottom:28px; color:var(--dim); font-size:.8rem; letter-spacing:3px; text-transform:uppercase; animation:bob 1.8s infinite; }
  @keyframes bob { 50% { transform:translateY(8px); opacity:.5 } }

  /* Timeline */
  .timeline { position:relative; max-width:1100px; margin:0 auto; overflow-x:clip; }
  #path-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  #path-bg { stroke:#2c2c31; stroke-width:3; fill:none; stroke-dasharray:6 10; }
  #path-fg { stroke:url(#grad); stroke-width:5; fill:none; filter:drop-shadow(0 0 8px #ed1d24aa); }
  #orb { fill:#fff; filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px var(--red)); }

  .event { position:relative; min-height:85vh; display:flex; align-items:center; padding:40px 16px; }
  .event.l { justify-content:flex-start; }
  .event.r { justify-content:flex-end; }
  .card { cursor:pointer; width:min(460px, 46%); background:linear-gradient(160deg,#1e1e22,#121215); border:1px solid #2c2c31; border-radius:16px; overflow:hidden;
          opacity:0; transform:translateY(60px) scale(.96); transition:opacity .8s, transform .8s cubic-bezier(.2,.8,.2,1), box-shadow .8s; }
  .event.l .card { transform:translateX(-60px) rotate(-2deg); }
  .event.r .card { transform:translateX(60px) rotate(2deg); }
  .event.visible .card { opacity:1; transform:none; box-shadow:0 20px 60px -20px var(--c); border-color:var(--c); }
  .card .img { height:230px; background-size:cover; background-position:center 25%; position:relative; transform:scale(1.15); transition:transform 1.6s ease; }
  .event.visible .card .img { transform:scale(1); }
  .card .img::after { content:''; position:absolute; inset:0; background:linear-gradient(0deg,#121215 0%,transparent 60%); }
  .card .body { padding:4px 22px 22px; position:relative; }
  .era { color:var(--c); font-size:.75rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; }
  .card h2 { margin:6px 0 8px; font-size:1.45rem; }
  .card p { color:#cfcfd4; line-height:1.55; margin:0 0 14px; font-size:.95rem; }
  .thumbs { display:flex; gap:8px; }
  .thumbs img { width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid var(--c); opacity:0; transform:scale(.4); transition:.5s; }
  .event.visible .thumbs img { opacity:1; transform:none; }
  .event.visible .thumbs img:nth-child(2) { transition-delay:.15s } .event.visible .thumbs img:nth-child(3) { transition-delay:.3s }

  .big-year { position:absolute; top:50%; font-size:clamp(5rem,16vw,13rem); font-weight:900; color:transparent; -webkit-text-stroke:1px #ffffff18; pointer-events:none; user-select:none; will-change:transform; }
  .event.l .big-year { right:2%; } .event.r .big-year { left:2%; }
  .node { position:absolute; width:22px; height:22px; border-radius:50%; background:var(--bg); border:3px solid #444; transform:translate(-50%,-50%); transition:.4s; z-index:2; }
  .event.visible .node { border-color:var(--c); background:var(--c); box-shadow:0 0 0 8px color-mix(in srgb, var(--c) 25%, transparent), 0 0 30px var(--c); }
  .date-pill { position:absolute; transform:translate(-50%, 22px); white-space:nowrap; font-size:.75rem; color:var(--dim); font-weight:700; letter-spacing:1px; }

  .hud { position:fixed; right:18px; top:50%; transform:translateY(-50%); z-index:10; display:flex; flex-direction:column; gap:10px; }
  .hud a { width:10px; height:10px; border-radius:50%; background:#444; display:block; transition:.3s; }
  .hud a.on { background:var(--red); transform:scale(1.5); box-shadow:0 0 10px var(--red); }

  .outro { height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--dim); }
  .outro a { color:var(--red); }

  @media (max-width:760px) {
    .event.l, .event.r { justify-content:flex-end; }
    .card { width:calc(100% - 56px); }
    .event:not(.visible) .card { transform:translateX(60px); }
    .big-year { display:none; }
    .hud { display:none; }
  }
  .more { display:inline-flex; align-items:center; gap:6px; margin-top:14px; background:none; border:1px solid var(--c, #ed1d24); color:var(--c, #ed1d24); border-radius:20px; padding:6px 14px; font-size:.8rem; font-weight:700; cursor:pointer; letter-spacing:.5px; transition:background .2s, color .2s; }
  .more:hover, .more:focus-visible { background:var(--c, #ed1d24); color:#000; outline:none; }
</style>
</head>
<body>
<a class="back" href="index.html">← Maquettes</a>

<section class="intro">
  <h1>L'univers <span>MARVEL</span></h1>
  <p>Des Célestes au Multivers : suivez le chemin de l'histoire, une époque à la fois.</p>
  <div class="scroll-hint">Descendre ↓</div>
</section>

<section class="timeline" id="timeline">
  <svg id="path-svg">
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse"></linearGradient>
    </defs>
    <path id="path-bg"/><path id="path-fg"/>
    <circle id="orb" r="9"/>
  </svg>
</section>
<nav class="hud" id="hud"></nav>

<section class="outro"><p>À suivre… <br><br><a href="../index.html#/chronologie">Voir l'ordre de visionnage →</a></p></section>

<script src="events.js"></script>
<script src="detail.js"></script>
<script>
const tl = document.getElementById('timeline');
const hud = document.getElementById('hud');
TIMELINE.forEach((ev, i) => {
  const s = document.createElement('div');
  s.className = 'event ' + (i % 2 ? 'l' : 'r'); s.id = 'ev' + i; s.style.setProperty('--c', ev.color);
  s.innerHTML = `
    <div class="big-year">${ev.year}</div>
    <div class="node"></div><div class="date-pill">${ev.date}</div>
    <article class="card">
      <div class="img" style="background-image:url('${ev.image}')"></div>
      <div class="body">
        <div class="era">${ev.era}</div>
        <h2>${ev.title}</h2>
        <p>${ev.text}</p>
        <div class="thumbs">${ev.thumbs.map(t => `<img src="${t}" alt="">`).join('')}</div>
        <button class="more">Déployer la carte +</button>
      </div>
    </article>`;
  tl.appendChild(s);
  s.querySelector('.card').addEventListener('click', e => Detail.open(i, e.currentTarget));
  const a = document.createElement('a'); a.href = '#ev' + i; a.title = ev.era; hud.appendChild(a);
});

const svg = document.getElementById('path-svg');
const pathBg = document.getElementById('path-bg'), pathFg = document.getElementById('path-fg');
const orb = document.getElementById('orb');
const events = [...document.querySelectorAll('.event')];
let len = 0;

// Construit un chemin serpentin passant par un nœud par événement
function buildPath() {
  const W = tl.clientWidth, mobile = W < 760;
  const pts = events.map((e, i) => {
    const y = e.offsetTop + e.offsetHeight / 2;
    const x = mobile ? 24 : (i % 2 === 0 ? W * 0.36 : W * 0.64);   // le nœud est du côté opposé à la carte
    return [x, y];
  });
  pts.unshift([mobile ? 24 : W / 2, 0]);
  pts.push([mobile ? 24 : W / 2, tl.offsetHeight]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], my = (y0 + y1) / 2;
    d += ` C${x0},${my} ${x1},${my} ${x1},${y1}`;
  }
  pathBg.setAttribute('d', d); pathFg.setAttribute('d', d);
  len = pathFg.getTotalLength();
  pathFg.style.strokeDasharray = len;
  events.forEach((e, i) => {
    const [x] = pts[i + 1];
    e.querySelector('.node').style.cssText = `left:${x}px; top:50%`;
    e.querySelector('.date-pill').style.cssText = `left:${x}px; top:50%`;
  });
  // dégradé de couleur le long du chemin
  const g = document.getElementById('grad');
  g.setAttribute('y2', tl.offsetHeight);
  g.innerHTML = events.map((e, i) => `<stop offset="${(e.offsetTop + e.offsetHeight/2) / tl.offsetHeight}" stop-color="${TIMELINE[i].color}"/>`).join('');
  onScroll();
}

function onScroll() {
  const r = tl.getBoundingClientRect();
  const target = window.innerHeight * 0.55 - r.top;            // la "tête" suit le milieu de l'écran
  const p = Math.max(0, Math.min(1, target / tl.offsetHeight));
  // trouve la longueur de chemin correspondant à la hauteur (recherche binaire)
  let lo = 0, hi = len;
  for (let k = 0; k < 18; k++) { const m = (lo + hi) / 2; pathFg.getPointAtLength(m).y < target ? lo = m : hi = m; }
  const L = p >= 1 ? len : lo;
  pathFg.style.strokeDashoffset = len - L;
  const pt = pathFg.getPointAtLength(L);
  orb.setAttribute('cx', pt.x); orb.setAttribute('cy', pt.y);

  events.forEach((e, i) => {
    const er = e.getBoundingClientRect();
    if (er.top < window.innerHeight * 0.7) e.classList.add('visible'); else e.classList.remove('visible');
    const by = e.querySelector('.big-year');
    by.style.transform = `translateY(calc(-50% + ${(er.top + er.height/2 - innerHeight/2) * -0.35}px))`;
    hud.children[i].classList.toggle('on', er.top < innerHeight / 2 && er.bottom > innerHeight / 2);
  });
}
addEventListener('scroll', () => requestAnimationFrame(onScroll), { passive: true });
addEventListener('resize', buildPath);
addEventListener('load', buildPath);
buildPath();
</script>
</body>
</html>
