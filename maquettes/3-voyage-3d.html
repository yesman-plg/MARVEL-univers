<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maquette 3 — Voyage 3D</title>
<style>
  :root { --red:#ed1d24; --bg:#05050a; --text:#eee; --dim:#a3a3ab; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  canvas#gl { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  .back { position:fixed; top:14px; left:16px; z-index:30; color:var(--dim); text-decoration:none; font-size:.85rem; background:#000a; padding:6px 10px; border-radius:6px; }
  #spacer { height:900vh; }   /* longueur de scroll = longueur du voyage */

  .overlay { position:fixed; left:5vw; bottom:9vh; width:min(440px, calc(100vw - 32px)); z-index:10; pointer-events:none; }
  .info { pointer-events:auto; cursor:pointer; background:#0b0b12cc; backdrop-filter:blur(10px); border:1px solid #ffffff1a; border-left:4px solid var(--c, var(--red)); border-radius:14px; padding:20px 22px;
          transition:opacity .5s, transform .5s; }
  .info.hide { opacity:0; transform:translateY(30px); }
  .info .era { color:var(--c); font-weight:800; letter-spacing:2px; font-size:.75rem; text-transform:uppercase; }
  .info h2 { margin:6px 0 8px; font-size:1.6rem; }
  .info p { margin:0 0 12px; color:#cfcfd4; line-height:1.55; font-size:.95rem; }
  .info .thumbs img { width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid var(--c); margin-right:6px; }

  .title { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:5; pointer-events:none; text-align:center; transition:opacity .4s; }
  .title h1 { font-size:clamp(2.4rem,8vw,6rem); margin:0; font-style:italic; font-weight:900; text-shadow:0 0 40px #ed1d2499; }
  .title h1 b { color:var(--red); }
  .title p { color:var(--dim); letter-spacing:3px; text-transform:uppercase; font-size:.8rem; }

  .gauge { position:fixed; right:22px; top:15vh; bottom:15vh; width:2px; background:#ffffff1a; z-index:10; }
  .gauge .fill { position:absolute; top:0; left:0; width:100%; background:var(--red); box-shadow:0 0 10px var(--red); }
  .gauge .lbl { position:absolute; right:12px; transform:translateY(-50%); font-size:.7rem; color:var(--dim); white-space:nowrap; transition:color .3s; }
  .gauge .lbl.on { color:#fff; font-weight:700; }
  .nogl { position:fixed; inset:0; display:none; align-items:center; justify-content:center; color:var(--dim); }
  @media (max-width:760px) { .gauge .lbl { display:none; } .overlay { left:16px; bottom:16px; } }
  .more { display:inline-flex; align-items:center; gap:6px; margin-top:14px; background:none; border:1px solid var(--c, #ed1d24); color:var(--c, #ed1d24); border-radius:20px; padding:6px 14px; font-size:.8rem; font-weight:700; cursor:pointer; letter-spacing:.5px; transition:background .2s, color .2s; }
  .more:hover, .more:focus-visible { background:var(--c, #ed1d24); color:#000; outline:none; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<a class="back" href="index.html">← Maquettes</a>
<canvas id="gl"></canvas>
<div class="title" id="title"><h1>Voyage dans l'univers <b>MARVEL</b></h1><p>Faites défiler pour avancer dans le temps</p></div>
<div class="overlay"><div class="info hide" id="info"></div></div>
<div class="gauge" id="gauge"><div class="fill" id="gfill"></div></div>
<div class="nogl" id="nogl">WebGL indisponible sur ce navigateur.</div>
<div id="spacer"></div>

<script src="events.js"></script>
<script src="detail.js"></script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05050a, 0.018);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);

// --- Le chemin : une courbe qui serpente dans l'espace -----------------------
const N = TIMELINE.length, STEP = 40;
const ctrl = [];
for (let i = 0; i <= N + 1; i++) ctrl.push(new THREE.Vector3(Math.sin(i * 1.3) * 14, Math.cos(i * 0.9) * 6, -i * STEP));
const curve = new THREE.CatmullRomCurve3(ctrl);

// ruban lumineux le long du chemin
const tube = new THREE.Mesh(
  new THREE.TubeGeometry(curve, 600, 0.06, 6, false),
  new THREE.MeshBasicMaterial({ color: 0xed1d24, transparent: true, opacity: 0.8 })
);
tube.position.y = -2.2; scene.add(tube);

// étoiles
const starGeo = new THREE.BufferGeometry(), S = 5000, arr = new Float32Array(S * 3);
for (let i = 0; i < S; i++) { arr[i*3] = (Math.random()-.5)*300; arr[i*3+1] = (Math.random()-.5)*200; arr[i*3+2] = 20 - Math.random() * (N + 2) * STEP; }
starGeo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 0.22, color: 0xffffff, transparent: true, opacity: 0.9 }));
scene.add(stars);

// --- Une "station" par événement : affiche, anneau-portail, gemme -----------
const loader = new THREE.TextureLoader();
const stations = TIMELINE.map((ev, i) => {
  const t = (i + 1) / (N + 1);
  const p = curve.getPointAt(t);
  const side = i % 2 ? -1 : 1;
  const g = new THREE.Group();
  const narrow = innerWidth < innerHeight;            // portrait (mobile) : stations plus proches du chemin
  g.position.copy(p).add(new THREE.Vector3(side * (narrow ? 2.5 : 8), narrow ? 2 : 1, 0));
  if (narrow) g.scale.setScalar(0.7);
  g.lookAt(curve.getPointAt(Math.max(0, t - 0.05)));   // l'affiche fait face à la caméra qui arrive
  const color = new THREE.Color(ev.color);

  const tex = loader.load(ev.image); tex.colorSpace = THREE.SRGBColorSpace;
  const poster = new THREE.Mesh(new THREE.PlaneGeometry(6, 9), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  g.add(poster);
  const frame = new THREE.Mesh(new THREE.PlaneGeometry(6.5, 9.5), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35 }));
  frame.position.z = -0.05; g.add(frame);

  const ring = new THREE.Mesh(new THREE.TorusGeometry(7.5, 0.08, 8, 90), new THREE.MeshBasicMaterial({ color }));
  g.add(ring);

  const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.9), new THREE.MeshBasicMaterial({ color, wireframe: true }));
  gem.position.set(-side * 5, 4, 1); g.add(gem);

  // portraits flottants
  ev.thumbs.forEach((src, k) => {
    const tt = loader.load(src); tt.colorSpace = THREE.SRGBColorSpace;
    const disc = new THREE.Mesh(new THREE.CircleGeometry(1.1, 40), new THREE.MeshBasicMaterial({ map: tt, transparent: true }));
    disc.position.set(side * (4.2 + k * 0.4), -3 + k * 2.6, 1.2 + k * 0.3); disc.userData.float = k;
    g.add(disc);
  });
  scene.add(g);
  const mats = []; g.traverse(o => { if (o.material) { o.material.transparent = true; mats.push([o.material, o.material.opacity]); } });
  return { g, ring, gem, poster, t, ev, mats };
});

// --- HTML : jauge + carte d'info ---------------------------------------------
const gauge = document.getElementById('gauge'), info = document.getElementById('info');
const labels = TIMELINE.map((ev, i) => {
  const l = document.createElement('div'); l.className = 'lbl';
  l.style.top = ((i + 1) / (N + 1) * 100) + '%'; l.textContent = ev.date; gauge.appendChild(l); return l;
});
let active = -1;
info.addEventListener('click', () => { if (active >= 0) Detail.open(active, info); });
function showInfo(i) {
  if (i === active) return; active = i;
  info.classList.add('hide');
  setTimeout(() => {
    if (i < 0) return;
    const ev = TIMELINE[i];
    info.style.setProperty('--c', ev.color);
    info.innerHTML = `<div class="era">${ev.era} · ${ev.date}</div><h2>${ev.title}</h2><p>${ev.text}</p>
      <div class="thumbs">${ev.thumbs.map(s => `<img src="${s}" alt="">`).join('')}</div>
      <button class="more">Déployer la carte +</button>`;
    if (active === i) info.classList.remove('hide');
  }, 350);
}

// clic direct sur une affiche 3D
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
canvas.addEventListener('click', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(stations.filter(s => s.g.visible).map(s => s.poster))[0];
  if (hit) Detail.open(stations.findIndex(s => s.poster === hit.object), null);
});
canvas.addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  canvas.style.cursor = ray.intersectObjects(stations.filter(s => s.g.visible).map(s => s.poster)).length ? 'pointer' : '';
});

// --- Boucle ------------------------------------------------------------------
let target = 0, prog = 0;
function onScroll() { target = scrollY / (document.documentElement.scrollHeight - innerHeight); }
addEventListener('scroll', onScroll, { passive: true });
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const time = clock.getElapsedTime();
  prog += (target - prog) * 0.07;                      // inertie douce
  const t = Math.min(prog * 0.985 + 0.001, 0.99);
  const pos = curve.getPointAt(t), look = curve.getPointAt(Math.min(t + 0.012, 1));
  camera.position.copy(pos);
  camera.lookAt(look);

  stations.forEach((s, i) => {
    s.ring.rotation.z = time * 0.2 + i;
    s.gem.rotation.x = time; s.gem.rotation.y = time * 1.3;
    s.g.children.forEach(c => { if (c.userData.float !== undefined) c.position.y += Math.sin(time * 1.5 + c.userData.float) * 0.004; });
    const d = Math.abs(t - s.t) * (N + 1);              // 0 quand on est à la station
    s.ring.scale.setScalar(1 + Math.max(0, 1 - d) * 0.15);
    // une fois dépassée, la station s'efface pour ne pas boucher la vue
    const passed = (t - s.t) * (N + 1);
    const fade = passed > 0 ? Math.max(0, 1 - passed * 6) : 1;
    s.mats.forEach(([m, o]) => m.opacity = o * fade);
    s.g.visible = fade > 0.01;
  });
  stars.rotation.z = time * 0.01;

  // événement actif = la station la plus proche devant/autour de la caméra
  let best = -1, bd = 1e9;
  stations.forEach((s, i) => { const d = s.t - t; if (d > 0 && d < 0.09 && Math.abs(d) < bd) { bd = Math.abs(d); best = i; } });
  showInfo(best);
  labels.forEach((l, i) => l.classList.toggle('on', i === best));
  document.getElementById('gfill').style.height = (prog * 100) + '%';
  document.getElementById('title').style.opacity = Math.max(0, 1 - prog * 25);
  renderer.render(scene, camera);
});
</script>
<script>
// repli si WebGL ou le CDN ne répond pas
setTimeout(() => { const c = document.getElementById('gl'); if (!c.getContext('webgl2') && !c.getContext('webgl')) document.getElementById('nogl').style.display = 'flex'; }, 1500);
</script>
</body>
</html>
