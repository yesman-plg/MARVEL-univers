<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maquette 6 — Planche de comics</title>
<style>
  :root { --red:#ed1d24; --gold:#d4af37; --bg:#0d0d0f; --ink:#f2f2f2; --dim:#a3a3ab; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow-x:hidden;
         background-image:radial-gradient(#ffffff0d 1px, transparent 1.2px); background-size:7px 7px; }
  .back { position:fixed; top:14px; left:16px; z-index:30; color:var(--dim); text-decoration:none; font-size:.85rem; background:#000c; padding:6px 10px; border-radius:6px; }

  .cover { min-height:92vh; display:grid; place-items:center; text-align:center; padding:60px 16px; }
  .cover .issue { display:inline-block; background:var(--red); color:#fff; font-weight:900; padding:6px 14px; transform:rotate(-3deg); letter-spacing:2px; font-size:.8rem; }
  .cover h1 { font-size:clamp(3rem,11vw,8rem); line-height:.9; margin:18px 0; font-weight:900; text-transform:uppercase; font-style:italic;
              color:var(--ink); text-shadow:5px 5px 0 var(--red), 10px 10px 0 #000; transform:skewX(-6deg); }
  .cover p { color:var(--dim); max-width:520px; margin:0 auto; }

  .page { max-width:1100px; margin:0 auto 90px; padding:0 16px; }
  .chapter { display:flex; align-items:baseline; gap:14px; margin-bottom:14px; }
  .chapter .num { font-weight:900; font-size:3rem; color:var(--c); line-height:1; }
  .chapter .lbl { font-weight:800; letter-spacing:3px; text-transform:uppercase; font-size:.8rem; color:var(--dim); }
  .grid { display:grid; grid-template-columns:1.6fr 1fr; grid-template-rows:auto auto; gap:14px; }
  .panel { position:relative; border:3px solid var(--ink); background:#111; overflow:hidden; cursor:pointer;
           clip-path:polygon(0 0, 0 0, 0 100%, 0 100%); transition:clip-path .9s cubic-bezier(.7,0,.2,1), transform .3s; }
  .page.in .panel { clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%); }
  .page.in .panel:nth-child(2) { transition-delay:.25s } .page.in .panel:nth-child(3) { transition-delay:.5s }
  .panel:hover { transform:translateY(-4px) rotate(-.4deg); box-shadow:8px 8px 0 var(--c); }
  .panel:focus-visible { outline:3px solid var(--gold); outline-offset:4px; }

  .p-main { grid-row:span 2; min-height:520px; }
  .p-main .art { position:absolute; inset:-60px 0; background-size:cover; background-position:center; will-change:transform; filter:contrast(1.15) saturate(1.2); }
  .p-main .art::after { content:''; position:absolute; inset:0; background:radial-gradient(#000 22%, transparent 24%) 0 0/6px 6px; opacity:.35; mix-blend-mode:multiply; }
  .caption { position:absolute; top:14px; left:14px; max-width:70%; background:var(--gold); color:#111; font-weight:800; padding:8px 12px; font-size:.85rem;
             text-transform:uppercase; letter-spacing:.5px; border:2px solid #111; box-shadow:4px 4px 0 #111; }
  .sfx { position:absolute; right:6%; bottom:10%; font-size:clamp(2.6rem,7vw,5rem); font-weight:900; font-style:italic; color:var(--red); letter-spacing:2px;
         -webkit-text-stroke:2px #111; text-shadow:4px 4px 0 var(--gold), 7px 7px 0 #111; transform:rotate(-10deg) scale(.2); opacity:0;
         transition:transform .5s cubic-bezier(.3,1.8,.5,1) .9s, opacity .2s .9s; }
  .page.in .sfx { transform:rotate(-10deg) scale(1); opacity:1; }

  .p-talk { padding:22px; display:flex; flex-direction:column; justify-content:center; background:#16161a; }
  .bubble { position:relative; background:var(--ink); color:#111; border-radius:24px; padding:16px 18px; font-size:.95rem; line-height:1.5; border:2px solid #111; }
  .bubble::after { content:''; position:absolute; left:34px; bottom:-18px; border:10px solid transparent; border-top:12px solid var(--ink); }
  .bubble b { display:block; font-size:1.2rem; margin-bottom:4px; text-transform:uppercase; }
  .who { display:flex; align-items:center; gap:10px; margin-top:26px; font-weight:700; font-size:.85rem; color:var(--dim); }
  .who img { width:52px; height:52px; border-radius:50%; object-fit:cover; border:3px solid var(--c); }

  .p-cast { display:grid; grid-template-columns:repeat(3,1fr); gap:0; background:#000; }
  .p-cast div { aspect-ratio:1; background-size:cover; background-position:center top; border-left:3px solid var(--ink); filter:grayscale(.3) contrast(1.1); }
  .p-cast div:first-child { border-left:0; }
  .p-cast .open { position:absolute; right:10px; bottom:10px; background:var(--red); color:#fff; font-weight:900; font-size:.75rem; letter-spacing:1px; padding:6px 10px; border:2px solid #111; box-shadow:3px 3px 0 #111; text-transform:uppercase; }

  .end { text-align:center; padding:40px 16px 90px; color:var(--dim); }
  .end b { display:block; font-size:2.6rem; color:var(--ink); font-style:italic; text-shadow:4px 4px 0 var(--red); }

  @media (max-width:760px) {
    .grid { grid-template-columns:1fr; }
    .p-main { grid-row:auto; min-height:380px; }
  }
  @media (prefers-reduced-motion:reduce) { .panel, .sfx { transition:none; clip-path:none; } .sfx { transform:rotate(-10deg); opacity:1; } }
</style>
</head>
<body>
<a class="back" href="index.html">← Maquettes</a>
<header class="cover">
  <div>
    <span class="issue">Numéro spécial · L'histoire complète</span>
    <h1>L'univers<br>Marvel</h1>
    <p>Huit chapitres, des Célestes au Multivers. Faites défiler pour tourner les pages, cliquez une case pour lire le chapitre en entier.</p>
  </div>
</header>
<main id="book"></main>
<div class="end"><b>À suivre…</b>dans le prochain numéro</div>

<script src="events.js"></script>
<script src="detail.js"></script>
<script>
const SFX = ['BOOM!', 'KRAK!', 'WHAM!', 'ZZAP!', 'KRAKOOM!', 'CLANG!', 'SNAP!', 'WHOOSH!'];
const book = document.getElementById('book');
TIMELINE.forEach((ev, i) => {
  const sec = document.createElement('section');
  sec.className = 'page'; sec.style.setProperty('--c', ev.color);
  const speaker = (ev.chars || [])[0] || { name: '', img: ev.thumbs[0] };
  const cast = (ev.chars || []).slice(0, 3);
  sec.innerHTML = `
    <div class="chapter"><span class="num">${String(i + 1).padStart(2, '0')}</span><span class="lbl">Chapitre · ${ev.era}</span></div>
    <div class="grid">
      <div class="panel p-main" tabindex="0" role="button" aria-label="Lire le chapitre ${ev.title}">
        <div class="art" style="background-image:url('${ev.image}')"></div>
        <div class="caption">${ev.date} — ${ev.tags[0]}</div>
        <div class="sfx">${SFX[i]}</div>
      </div>
      <div class="panel p-talk" tabindex="0" role="button" aria-label="Lire le chapitre ${ev.title}">
        <div class="bubble"><b>${ev.title}</b>${ev.text}</div>
        <div class="who"><img src="${speaker.img}" alt="">${speaker.name}</div>
      </div>
      <div class="panel p-cast" style="grid-template-columns:repeat(${cast.length},1fr)" tabindex="0" role="button" aria-label="Voir les personnages de ${ev.title}">
        ${cast.map(c => `<div style="background-image:url('${c.img}')" title="${c.name}"></div>`).join('')}
        <span class="open">Lire le chapitre +</span>
      </div>
    </div>`;
  book.appendChild(sec);
  sec.querySelectorAll('.panel').forEach(p => {
    p.addEventListener('click', () => Detail.open(i, p));
    p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); Detail.open(i, p); } });
  });
});
// les cases se dessinent quand la page entre à l'écran
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }), { threshold: .25 });
document.querySelectorAll('.page').forEach(p => io.observe(p));
// parallaxe de l'image principale
const arts = [...document.querySelectorAll('.p-main .art')];
function par() { arts.forEach(a => { const r = a.parentElement.getBoundingClientRect(); a.style.transform = `translateY(${(r.top + r.height / 2 - innerHeight / 2) * -0.12}px)`; }); }
addEventListener('scroll', () => requestAnimationFrame(par), { passive: true }); par();
</script>
</body>
</html>
