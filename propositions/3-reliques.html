<style>
  /* Frise historique à gauche (dates · règle · récit), vitrine 3D fixe à droite :
     une relique par chapitre, présentée comme dans un musée. */
  .vitrine { position: fixed; top: 0; right: 0; width: 44vw; height: 100vh; }
  #relic { width: 100%; height: 100%; display: block; }
  .vitrine::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: linear-gradient(90deg, var(--bg) 0%, transparent 18%), radial-gradient(ellipse 60% 50% at 50% 46%, transparent 40%, var(--bg) 100%); }
  .cartel { position: absolute; left: 12%; right: 12%; bottom: 7vh; z-index: 2; text-align: center; transition: opacity .5s; }
  .cartel.swap { opacity: 0; }
  .cartel .n { font: 500 .68rem/1 var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
  .cartel h3 { font: 400 italic 1.9rem/1.15 var(--f-display); margin: 10px 0 8px; }
  .cartel p { font-size: .9rem; color: var(--ink-2); margin: 0 auto; max-width: 40ch; }
  .cartel::before { content: ''; display: block; width: 40px; height: 1px; background: var(--gold); margin: 0 auto 16px; }

  main { width: 56vw; padding: 0 64px 30vh max(64px, env(safe-area-inset-left, 0px)); }
  .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; max-width: 640px; }
  .hero h1 { font: 400 clamp(3rem, 6vw, 5.4rem)/.96 var(--f-display); letter-spacing: -.02em; margin: 18px 0 24px; }
  .hero h1 em { color: var(--red); }
  .hero p { color: var(--ink-2); font-size: 1.08rem; max-width: 46ch; margin: 0; }
  .hero .index { margin-top: 44px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; border-top: 1px solid var(--rule); }
  .hero .index a { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink-2); font-size: .88rem; transition: color .2s; }
  .hero .index a b { font: 400 italic 1rem/1.4 var(--f-display); color: var(--gold); min-width: 2.4em; }
  .hero .index a:hover { color: var(--ink); }

  /* frise : colonne de dates, règle, contenu */
  .chapter { position: relative; }
  .chapter-head { padding-left: 172px; }
  .timeline { position: relative; }
  .timeline::before { content: ''; position: absolute; left: 148px; top: 0; bottom: 0; width: 1px; background: var(--rule); }
  .timeline .progress { position: absolute; left: 148px; top: 0; width: 1px; height: 0; background: linear-gradient(var(--red), var(--gold)); }
  .row { position: relative; display: grid; grid-template-columns: 124px 1fr; gap: 48px; }
  .row .when b { text-wrap: balance; }
  .row .when { text-align: right; padding-top: 36px; font: 500 .8rem/1.35 var(--f-mono); letter-spacing: .04em; color: var(--dim); transition: color .4s; }
  .row .when b { display: block; font: 400 1.18rem/1.2 var(--f-display); color: var(--ink-2); letter-spacing: 0; margin-bottom: 4px; transition: color .4s; }
  .row::after { content: ''; position: absolute; left: 144px; top: 44px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 1px solid var(--dim); transition: .4s; }
  .row.passed::after { border-color: var(--gold); background: var(--gold); }
  .row.active::after { border-color: var(--red); background: var(--red); box-shadow: 0 0 0 6px #ed1d2422; }
  .row.active .when b { color: var(--ink); } .row.active .when { color: var(--red); }
  .row .entry { border-top: 0; }
  .row .entry .entry-date { display: none; }
  .row + .row .entry { border-top: 1px solid var(--rule); }
  .end { padding: 18vh 0 0 172px; font: 400 italic 1.5rem/1.4 var(--f-display); color: var(--ink-2); }
  .end a { color: var(--gold-2); }

  @media (max-width: 900px) {
    .vitrine { width: 100vw; height: 40vh; z-index: 5; background: var(--bg); }
    .vitrine::before { background: linear-gradient(transparent 55%, var(--bg)); }
    .cartel { bottom: 8px; } .cartel h3 { font-size: 1.3rem; margin: 6px 0 0; } .cartel p, .cartel::before { display: none; }
    main { width: 100%; padding: 40vh max(16px, env(safe-area-inset-right, 0px)) 30vh max(16px, env(safe-area-inset-left, 0px)); }
    .hero { min-height: auto; padding: 30px 0; } .hero .index { grid-template-columns: 1fr; }
    .chapter-head { padding-left: 0; }
    .timeline::before, .timeline .progress { left: 6px; }
    .row { grid-template-columns: 1fr; gap: 0; padding-left: 28px; }
    .row .when { text-align: left; padding-top: 24px; } .row .when b { display: inline; font-size: 1.15rem; margin-right: 8px; }
    .row::after { left: 2px; top: 30px; }
    .row .entry { padding-top: 10px; }
    .end { padding-left: 0; }
  }
</style>

<main>
  <section class="hero">
    <span class="eyebrow">Chronologie de l'univers Marvel</span>
    <h1>Les Reliques<br>du <em>MCU</em></h1>
    <p>L'histoire complète, dans l'ordre où elle se déroule, racontée en dix chapitres. Chaque chapitre est présenté avec l'objet qui l'a marqué.</p>
    <nav class="index" id="index"></nav>
  </section>

<script src="commun.js"></script>
<script>
// Cartel de musée : une relique par chapitre
const RELICS = [
  ["Les Pierres d'Infinité", "Six fragments nés avant l'univers : l'Espace, l'Esprit, la Réalité, le Pouvoir, le Temps et l'Âme. Réunies, elles donnent un pouvoir absolu."],
  ["Le bouclier de Captain America", "Forgé par Howard Stark en vibranium du Wakanda. Presque indestructible, il absorbe les chocs au lieu de les renvoyer."],
  ["Le Tesseract", "Le cube qui renferme la Pierre de l'Espace. Hydra en tire ses armes, le S.H.I.E.L.D. l'étudie, et son énergie donne ses pouvoirs à Carol Danvers."],
  ["Le réacteur ARK", "Construit dans une grotte en Afghanistan. Il maintient Tony Stark en vie et alimente l'armure d'Iron Man."],
  ["Mjolnir", "Le marteau de Thor, forgé au cœur d'une étoile mourante. Seul celui qui en est digne peut le soulever."],
  ["L'Œil d'Agamotto", "Amulette des Maîtres des arts mystiques, qui protège la Pierre du Temps. Doctor Strange en devient le gardien."],
  ["Le Gant de l'Infini", "Forgé à Nidavellir pour porter les six Pierres. Il suffit d'un claquement de doigts."],
  ["Le Blip", "La moitié de toute vie réduite en poussière. Cinq années de deuil pour ceux qui restent."],
  ["Le bouclier, transmis", "Steve Rogers le confie à Sam Wilson. Un nouveau Captain America pour un monde qui se reconstruit."],
  ["La ligne temporelle sacrée", "Libérée par la mort de Celui qui Demeure, elle se ramifie en une infinité d'univers."],
];
const story = document.getElementById('story');
story.innerHTML = CHRONO.chapters.map((ch, ci) => `
  <section class="chapter" data-ci="${ci}">
    ${Chrono.chapterHeadHTML(ch, ci)}
    <div class="timeline"><div class="progress"></div>
      ${ch.events.map(ev => `<div class="row" data-gi="${ev.gi}"><div class="when"><b>${ev.date.replace(/^Vers /, 'v. ')}</b>${ev.geo.label}</div>${Chrono.entryHTML(ev)}</div>`).join('')}
    </div>
  </section>`).join('');
Chrono.bindExpand(story);
document.getElementById('index').innerHTML = CHRONO.chapters.map((ch, ci) => `<a href="#ch-${ci}"><b>${Chrono.ROMAN[ci]}</b>${ch.title}</a>`).join('');

const rows = [...document.querySelectorAll('.row')], chapters = [...document.querySelectorAll('.chapter')];
window.currentChapter = -1;
function onScroll() {
  const line = innerHeight * (innerWidth < 900 ? .62 : .5);
  const a = Chrono.activeIndex(rows, line);
  const started = rows[0].getBoundingClientRect().top < line + 200 || chapters[0].getBoundingClientRect().top < line;
  rows.forEach((r, i) => { r.classList.toggle('active', started && i === a); r.classList.toggle('passed', started && i < a); });
  chapters.forEach(c => {
    const tl = c.querySelector('.timeline'), r = tl.getBoundingClientRect();
    tl.querySelector('.progress').style.height = Math.max(0, Math.min(r.height, line - r.top)) + 'px';
  });
  let ci = -1; chapters.forEach((c, i) => { if (c.getBoundingClientRect().top < line) ci = i; });
  if (ci !== window.currentChapter) { window.currentChapter = ci; window.dispatchEvent(new CustomEvent('chapter', { detail: ci })); }
}
addEventListener('scroll', () => requestAnimationFrame(onScroll), { passive: true });
addEventListener('load', onScroll); onScroll();

const cartel = document.getElementById('cartel');
function setCartel(ci) {
  cartel.classList.add('swap');
  setTimeout(() => {
    const k = Math.max(0, ci);
    document.getElementById('cn').textContent = ci < 0 ? 'Collection' : `Relique · Chapitre ${Chrono.ROMAN[ci]}`;
    document.getElementById('ct').textContent = RELICS[k][0];
    document.getElementById('cd').textContent = RELICS[k][1];
    cartel.classList.remove('swap');
  }, 350);
}
addEventListener('chapter', e => setCartel(e.detail)); setCartel(-1);
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const canvas = document.getElementById('relic');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.setClearColor(0x0b0b0d, 1);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .03).texture;
const camera = new THREE.PerspectiveCamera(30, 1, .1, 100); camera.position.set(0, .35, 7.2);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), .55, .45, .92); composer.addPass(bloom);
composer.addPass(new OutputPass());

// éclairage de vitrine : clé chaude, contre-jours rouge et or
const key = new THREE.SpotLight(0xffe2b8, 70, 30, .5, .7, 1.5); key.position.set(3, 7, 5); scene.add(key);
const rimR = new THREE.PointLight(0xed1d24, 30, 12, 1.5); rimR.position.set(-3.5, 1, -2.5); scene.add(rimR);
const rimG = new THREE.PointLight(0xc9a24a, 26, 12, 1.5); rimG.position.set(3.5, -.5, -2); scene.add(rimG);
scene.add(new THREE.AmbientLight(0xffffff, .15));

// socle
const plinth = new THREE.Group(); plinth.position.y = -1.85; scene.add(plinth);
const stone = new THREE.MeshStandardMaterial({ color: 0x141215, metalness: .4, roughness: .5 });
const goldM = new THREE.MeshStandardMaterial({ color: 0xc9a24a, metalness: 1, roughness: .25 });
plinth.add(new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.35, .3, 64), stone));
const lip = new THREE.Mesh(new THREE.TorusGeometry(1.26, .012, 8, 128), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.1, .5) })); lip.rotation.x = Math.PI / 2; lip.position.y = .155; plinth.add(lip);
const beamMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `varying vec2 vUv; void main(){ gl_FragColor = vec4(vec3(1.,.75,.45) * pow(1. - vUv.y, 2.5) * .12, 1.); }` });
const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.2, 3.6, 64, 1, true), beamMat); beam.position.y = 1.95; plinth.add(beam);
// poussière dans le faisceau
const motes = (() => { const n = 260, a = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const r = Math.sqrt(Math.random()) * 1.1, t = Math.random() * 6.28; a.set([Math.cos(t) * r, Math.random() * 3.4, Math.sin(t) * r], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(a, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ size: .018, color: 0xffd9a0, transparent: true, opacity: .6, depthWrite: false })); p.position.y = .2; plinth.add(p); return p; })();

// --- Les reliques -----------------------------------------------------------------------------
const glowC = (r, g, b) => new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b) });
const gem = (hex, s = 1) => {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.OctahedronGeometry(.22 * s, 0), new THREE.MeshPhysicalMaterial({ color: hex, metalness: 0, roughness: .05, transmission: .55, thickness: .6, ior: 1.8, emissive: hex, emissiveIntensity: .9, clearcoat: 1 }));
  m.scale.y = 1.35; g.add(m);
  const core = new THREE.Mesh(new THREE.OctahedronGeometry(.1 * s, 0), new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(2.2) })); core.scale.y = 1.35; g.add(core);
  return g;
};
const STONES = [0x2f6bff, 0xffd400, 0xff2030, 0x9b30ff, 0x10d060, 0xff8a00];

const builders = [
  // 0 · Pierres d'Infinité en orbite
  () => { const g = new THREE.Group();
    STONES.forEach((c, i) => { const s = gem(c, 1.1); s.userData.orbit = i; g.add(s); });
    g.userData.tick = (t) => g.children.forEach(s => { const a = t * .35 + s.userData.orbit / 6 * Math.PI * 2;
      s.position.set(Math.cos(a) * 1.05, Math.sin(a * 2 + s.userData.orbit) * .18, Math.sin(a) * 1.05); s.rotation.y = t * 1.2; });
    return g; },
  // 1 · Bouclier
  () => shield(false),
  // 2 · Tesseract
  () => { const g = new THREE.Group();
    const cube = new THREE.Mesh(new RoundedBoxGeometry(1.3, 1.3, 1.3, 4, .04), new THREE.MeshPhysicalMaterial({ color: 0x9fd4ff, metalness: 0, roughness: .02, transmission: .7, thickness: 1.2, ior: 1.5, clearcoat: 1, attenuationColor: new THREE.Color(0x4aa8ff), attenuationDistance: 2.5 }));
    g.add(cube);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.32, 1.32, 1.32)), new THREE.LineBasicMaterial({ color: new THREE.Color(.6, 1.2, 2.4) })); g.add(edges);
    const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(.2, 1), glowC(1, 1.8, 3.2)); g.add(inner);
    const lattice = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(.7, .7, .7)), new THREE.LineBasicMaterial({ color: new THREE.Color(.3, .8, 2), transparent: true, opacity: .8 })); g.add(lattice);
    g.rotation.set(.5, .6, 0);
    g.userData.tick = (t) => { inner.scale.setScalar(1 + Math.sin(t * 3) * .08); lattice.rotation.set(t * .5, t * .7, 0); };
    return g; },
  // 3 · Réacteur ARK
  () => { const g = new THREE.Group();
    const steel = new THREE.MeshStandardMaterial({ color: 0x8a8f96, metalness: 1, roughness: .3 });
    const copper = new THREE.MeshStandardMaterial({ color: 0xb06a3a, metalness: 1, roughness: .35 });
    const base = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, .25, 64), steel); base.rotation.x = Math.PI / 2; g.add(base);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(1, .07, 16, 96), steel); g.add(rim);
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2;
      const coil = new THREE.Mesh(new RoundedBoxGeometry(.22, .34, .16, 2, .03), copper); coil.position.set(Math.cos(a) * .72, Math.sin(a) * .72, .14); coil.rotation.z = a + Math.PI / 2; g.add(coil); }
    const ring = new THREE.Mesh(new THREE.TorusGeometry(.5, .05, 12, 96), glowC(.5, 1.1, 1.6)); ring.position.z = .16; g.add(ring);
    const core = new THREE.Mesh(new THREE.CircleGeometry(.3, 64), glowC(1, 1.5, 1.9)); core.position.z = .17; g.add(core);
    const tri = new THREE.Mesh(new THREE.RingGeometry(.18, .24, 3), new THREE.MeshBasicMaterial({ color: new THREE.Color(.4, .8, 1.2) })); tri.position.z = .18; tri.rotation.z = Math.PI / 2; g.add(tri);
    g.rotation.y = -.35;
    g.userData.tick = (t) => { ring.material.color.setRGB(.5, 1.1 + Math.sin(t * 4) * .2, 1.6); };
    return g; },
  // 4 · Mjolnir
  () => { const g = new THREE.Group();
    const uru = new THREE.MeshStandardMaterial({ color: 0x9aa0a8, metalness: 1, roughness: .32 });
    const head = new THREE.Mesh(new RoundedBoxGeometry(1.5, .82, .82, 4, .08), uru); head.position.y = .7; g.add(head);
    [-1, 1].forEach(s => { const face = new THREE.Mesh(new THREE.CylinderGeometry(.33, .33, .03, 48), uru); face.rotation.z = Math.PI / 2; face.position.set(s * .76, .7, 0); g.add(face); });
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(.07, .08, 1.5, 24), new THREE.MeshStandardMaterial({ color: 0x3a2a1e, roughness: .8 })); handle.position.y = -.35; g.add(handle);
    const wrap = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(Array.from({ length: 60 }, (_, i) => new THREE.Vector3(Math.cos(i * .9) * .085, -1 + i * .019, Math.sin(i * .9) * .085))), 200, .022, 6), new THREE.MeshStandardMaterial({ color: 0x5a3a24, roughness: .7 })); g.add(wrap);
    const pommel = new THREE.Mesh(new THREE.CylinderGeometry(.1, .12, .12, 24), uru); pommel.position.y = -1.13; g.add(pommel);
    const strap = new THREE.Mesh(new THREE.TorusGeometry(.17, .025, 8, 32), new THREE.MeshStandardMaterial({ color: 0x3a2618, roughness: .8 })); strap.position.y = -1.36; g.add(strap);
    const bolt = new THREE.Mesh(new THREE.TorusGeometry(.9, .01, 4, 64, Math.PI * .7), glowC(1.2, 1.8, 3)); bolt.position.y = .7; g.add(bolt);
    g.rotation.set(.12, .5, -.18);
    g.userData.tick = (t) => { bolt.rotation.set(t * 2.3, t * 1.7, t); bolt.visible = Math.sin(t * 9) > .6; };
    return g; },
  // 5 · Œil d'Agamotto
  () => { const g = new THREE.Group();
    const outer = new THREE.Mesh(new THREE.TorusGeometry(.85, .09, 24, 96), goldM); g.add(outer);
    const disc = new THREE.Mesh(new THREE.LatheGeometry([[0, -.1], [.62, -.06], [.7, 0], [.62, .06], [0, .1]].map(([x, y]) => new THREE.Vector2(x, y)), 64), goldM.clone()); disc.material.side = THREE.DoubleSide; disc.rotation.x = Math.PI / 2; g.add(disc);
    const iris = new THREE.Mesh(new THREE.SphereGeometry(.24, 48, 24), glowC(.4, 2.6, .9)); iris.position.z = .05; g.add(iris);
    const lids = [1, -1].map(s => { const l = new THREE.Mesh(new THREE.SphereGeometry(.34, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), goldM); l.rotation.x = s > 0 ? Math.PI / 2 : -Math.PI / 2; l.position.z = .06; g.add(l); return l; });
    for (let i = 0; i < 4; i++) { const a = i / 4 * Math.PI * 2 + Math.PI / 4; const arm = new THREE.Mesh(new RoundedBoxGeometry(.18, .5, .12, 2, .03), goldM); arm.position.set(Math.cos(a) * .98, Math.sin(a) * .98, 0); arm.rotation.z = a - Math.PI / 2; g.add(arm); }
    const runes = new THREE.Mesh(new THREE.RingGeometry(1.15, 1.17, 96), glowC(.6, 2, .8)); g.add(runes);
    g.userData.tick = (t) => { const o = (Math.sin(t * .8) * .5 + .5) * 1.1; lids[0].rotation.x = Math.PI / 2 + o; lids[1].rotation.x = -Math.PI / 2 - o; runes.rotation.z = -t * .3; };
    return g; },
  // 6 · Gant de l'Infini (dos de la main : plaque et jointures serties)
  () => { const g = new THREE.Group();
    const plate = new THREE.Mesh(new RoundedBoxGeometry(1.3, 1.1, .3, 4, .12), goldM); plate.position.y = -.1; g.add(plate);
    const cuff = new THREE.Mesh(new THREE.CylinderGeometry(.62, .7, .7, 48, 1, true), goldM); cuff.position.y = -.95; g.add(cuff);
    const knuckles = [-.48, -.16, .16, .48];
    knuckles.forEach((x, i) => { const k = new THREE.Mesh(new RoundedBoxGeometry(.28, .42, .3, 3, .08), goldM); k.position.set(x, .62, .02); k.rotation.z = -x * .15; g.add(k);
      const s = gem(STONES[i], .55); s.position.set(x, .62, .2); g.add(s); });
    const thumb = new THREE.Mesh(new RoundedBoxGeometry(.3, .55, .3, 3, .08), goldM); thumb.position.set(-.82, .05, .05); thumb.rotation.z = .6; g.add(thumb);
    const ts = gem(STONES[4], .55); ts.position.set(-.86, .12, .22); g.add(ts);
    const center = gem(STONES[5], .95); center.position.set(0, -.12, .22); g.add(center);
    g.rotation.set(-.1, -.25, 0);
    g.userData.tick = (t) => g.children.forEach(c => { if (c.type === 'Group') c.rotation.z = Math.sin(t * 2 + c.position.x) * .08; });
    return g; },
  // 7 · Le Blip : une forme qui part en poussière
  () => { const g = new THREE.Group();
    const n = 5000, pos = new Float32Array(n * 3), dir = new Float32Array(n * 3), del = new Float32Array(n);
    for (let i = 0; i < n; i++) { const v = new THREE.Vector3().randomDirection(); const r = .82 + Math.random() * .1; v.multiplyScalar(r); v.y *= 1.25; v.toArray(pos, i * 3);
      new THREE.Vector3(1.2 + Math.random(), .4 + Math.random() * .8, (Math.random() - .5)).toArray(dir, i * 3); del[i] = (v.x + 1) * .5 + Math.random() * .25; }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('dir', new THREE.BufferAttribute(dir, 3)); geo.setAttribute('del', new THREE.BufferAttribute(del, 1));
    const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { p: { value: 0 } },
      vertexShader: `attribute vec3 dir; attribute float del; uniform float p; varying float vA; varying float vK;
        void main(){ float k = clamp((p - del) * 1.6, 0., 1.); vK = k; vec3 q = position + dir * k * k * 2.2 + vec3(0., sin(del * 40. + p * 6.) * .05 * k, 0.);
          vec4 mv = modelViewMatrix * vec4(q, 1.); gl_PointSize = (2.4 - k) * 2.6 * (7. / -mv.z); vA = 1. - k; gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `varying float vA; varying float vK; void main(){ vec2 d = gl_PointCoord - .5; if (dot(d,d) > .25) discard;
        vec3 c = mix(vec3(.75,.68,.6), vec3(1.4,.55,.25), vK); gl_FragColor = vec4(c, vA * .9); }` });
    g.add(new THREE.Points(geo, mat));
    g.userData.tick = (t) => { mat.uniforms.p.value = (t * .16) % 2. - .35; };   // forme intacte, puis poussière
    return g; },
  // 8 · Bouclier transmis, avec ailes
  () => shield(true),
  // 9 · Ligne temporelle qui se ramifie
  () => { const g = new THREE.Group();
    const pts = [], births = [];
    const grow = (a, dir, len, depth, b0) => { if (depth > 6) return;
      const steps = 10; let p = a.clone();
      for (let i = 0; i < steps; i++) { const q = p.clone().add(dir.clone().multiplyScalar(len / steps)); dir.x += (Math.random() - .5) * .12; dir.normalize();
        pts.push(p.x, p.y, p.z, q.x, q.y, q.z); births.push(b0 + i / steps * .14, b0 + (i + 1) / steps * .14); p = q; }
      const n = depth < 2 ? 2 : (Math.random() > .3 ? 2 : 1);
      for (let k = 0; k < n; k++) { const d = dir.clone().applyAxisAngle(new THREE.Vector3(0, 0, 1), (k - (n - 1) / 2) * (.6 + Math.random() * .4)).applyAxisAngle(new THREE.Vector3(0, 1, 0), (Math.random() - .5) * 1.2);
        grow(p, d, len * .72, depth + 1, b0 + .14); } };
    grow(new THREE.Vector3(0, -1.55, 0), new THREE.Vector3(0, 1, 0), 1.1, 0, 0);
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); geo.setAttribute('birth', new THREE.Float32BufferAttribute(births, 1));
    const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { p: { value: 0 } },
      vertexShader: `attribute float birth; uniform float p; varying float vA; varying float vB; void main(){ vA = smoothstep(birth, birth + .04, p); vB = birth; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
      fragmentShader: `varying float vA; varying float vB; void main(){ vec3 c = mix(vec3(2.2,1.6,.7), vec3(2.,.35,.25), smoothstep(.2,.9,vB)); gl_FragColor = vec4(c * vA, vA); }` });
    g.add(new THREE.LineSegments(geo, mat));
    const knot = new THREE.Mesh(new THREE.SphereGeometry(.06, 16, 16), glowC(2.4, 1.8, .9)); knot.position.y = -1.55; g.add(knot);
    g.userData.tick = (t) => { mat.uniforms.p.value = Math.min(1.1, (t * .18) % 1.6); g.rotation.y = Math.sin(t * .2) * .4; };
    g.userData.noSpin = true;
    return g; },
];

function shield(wings) {
  const g = new THREE.Group();
  const red = new THREE.MeshStandardMaterial({ color: 0xa01418, metalness: .3, roughness: .5, side: THREE.DoubleSide });
  const silver = new THREE.MeshStandardMaterial({ color: 0xc8cace, metalness: 1, roughness: .38, side: THREE.DoubleSide });
  const blue = new THREE.MeshStandardMaterial({ color: 0x173a8a, metalness: .3, roughness: .5, side: THREE.DoubleSide });
  const prof = (r0, r1) => { const p = []; for (let i = 0; i <= 12; i++) { const r = r0 + (r1 - r0) * i / 12; p.push(new THREE.Vector2(r, .22 * (1 - r * r))); } return p; };
  [[0, .36, blue], [.36, .6, red], [.6, .82, silver], [.82, 1.02, red]].forEach(([a, b, m]) => {
    const ring = new THREE.Mesh(new THREE.LatheGeometry(prof(a, b), 96), m); ring.rotation.x = Math.PI / 2; g.add(ring);
  });
  const back = new THREE.Mesh(new THREE.CircleGeometry(1.02, 96), silver); back.position.z = -.001; back.rotation.y = Math.PI; g.add(back);
  const star = new THREE.Shape(); for (let i = 0; i < 10; i++) { const r = i % 2 ? .13 : .33, a = Math.PI / 2 + i * Math.PI / 5; i ? star.lineTo(Math.cos(a) * r, Math.sin(a) * r) : star.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  const st = new THREE.Mesh(new THREE.ExtrudeGeometry(star, { depth: .04, bevelEnabled: true, bevelSize: .01, bevelThickness: .01 }), silver); st.position.z = .21; g.add(st);
  if (wings) [-1, 1].forEach(sd => {                      // ailes : plumes métalliques en éventail derrière le bouclier
    const wing = new THREE.Group(); wing.position.set(sd * .55, .15, -.25); wing.scale.x = sd; g.add(wing);
    for (let i = 0; i < 8; i++) {
      const len = 1.75 - i * .12, geo = new RoundedBoxGeometry(len, .11, .025, 2, .02); geo.translate(len / 2, 0, 0);
      const f = new THREE.Mesh(geo, silver); f.rotation.z = (6 + i * 9) * Math.PI / 180 - .25; f.position.z = -i * .012; wing.add(f);
    }
  });
  g.rotation.set(.05, -.45, 0);
  if (wings) g.scale.setScalar(.8);
  return g;
}

// --- Changement de relique --------------------------------------------------------------------
const holder = new THREE.Group(); holder.position.y = .1; scene.add(holder);
let current = null, outgoing = [], cur = -2;
function show(ci) {
  const k = Math.max(0, ci);
  if (k === cur) return; cur = k;
  if (current) { current.userData.out = 0; outgoing.push(current); }
  current = builders[k](); current.userData.in = 0; current.scale.setScalar(.001); holder.add(current);
}
addEventListener('chapter', e => show(e.detail)); show(window.currentChapter);

let mx = 0, my = 0;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.position.z = w / h < .9 ? 9.5 : 7.2; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const ease = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);    // léger dépassement
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (current) {
    current.userData.in = Math.min(1, current.userData.in + dt * 1.1);
    const s = ease(current.userData.in) * (current.userData.base || 1);
    current.scale.setScalar(Math.max(.001, s));
    current.userData.tick && current.userData.tick(t);
  }
  outgoing = outgoing.filter(o => { o.userData.out += dt * 2.2; o.scale.setScalar(Math.max(.001, 1 - o.userData.out)); o.rotation.y += dt * 4; if (o.userData.out >= 1) { holder.remove(o); return false; } return true; });
  holder.rotation.y += ((current && current.userData.noSpin ? 0 : Math.sin(t * .25) * .5) + mx * .6 - holder.rotation.y) * .04;
  holder.rotation.x += (my * .25 - holder.rotation.x) * .04;
  holder.position.y = .1 + Math.sin(t * 1.1) * .06;
  motes.rotation.y = t * .05;
  composer.render();
});
</script>
